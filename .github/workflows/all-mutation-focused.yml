name: Mutation-safe All focused verification
on:
  push:
    branches: [feature/mutation-safe-all]
    paths:
      - 'NativeCore.py'
      - 'pal_native.c'
      - 'Testing/test_27_all_mutation_safe.py'
      - '.github/workflows/all-mutation-focused.yml'
  workflow_dispatch:
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    strategy:
      fail-fast: false
      matrix:
        mode: [safe, fast]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -U pytest numpy numba pillow
      - run: gcc -std=c11 -O3 -fPIC -shared -o libpal_native.so pal_native.c -lm
      - name: Run focused regression
        env:
          PAL_TEST_MODE: ${{ matrix.mode }}
          NUMBA_DISABLE_CACHE: '1'
        run: python -u -m pytest -vv Testing/test_27_all_mutation_safe.py Testing/API/test_ilist_api.py --maxfail=3
