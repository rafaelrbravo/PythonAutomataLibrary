name: PAL API Audit
on:
  push:
    branches:
      - pal-audit-ci-fix
jobs:
  api-audit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [safe, fast]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -U pip pytest numpy numba pillow
      - run: gcc -std=c11 -O3 -fPIC -shared -o libpal_native.so pal_native.c -lm
      - name: Run API audit
        env:
          PAL_TEST_MODE: ${{ matrix.mode }}
        run: python -m pytest -q Testing/API
