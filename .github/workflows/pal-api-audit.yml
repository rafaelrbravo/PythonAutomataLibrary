name: PAL API Audit
on:
  push:
    branches:
      - pal-audit-ci-fix
jobs:
  api-audit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [safe, fast]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -U pip pytest numpy numba pillow
      - run: gcc -std=c11 -O3 -fPIC -shared -o libpal_native.so pal_native.c -lm
      - name: Run API audit
        env:
          PAL_TEST_MODE: ${{ matrix.mode }}
        run: python -m pytest -q Testing/API\n      - name: Keyword-fix pre-change benchmark\n        env:\n          PAL_BENCH_MODE: ${{ matrix.mode }}\n          NUMBA_DISABLE_CACHE: '1'\n        run: |\n          for i in 1 2 3 4 5; do\n            cd ..\n            python PythonAutomataLibrary/Testing/benchmark_keyword_binding.py\n            cd PythonAutomataLibrary\n          done
