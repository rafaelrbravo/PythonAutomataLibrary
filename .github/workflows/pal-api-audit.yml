name: PAL API Audit
on:
  push:
    branches:
      - main
      - pal-audit-ci-fix
      - fix/diffusion-mask-boundary-conditions
    paths-ignore:
      - 'Documentation/generators/**'
      - '.github/workflows/refresh-documentation-pdfs.yml'
      - 'Documentation/*.pdf'
  pull_request:
    branches:
      - main
    paths-ignore:
      - 'Documentation/generators/**'
      - '.github/workflows/refresh-documentation-pdfs.yml'
concurrency:
  group: pal-api-audit-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}
jobs:
  api-audit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [safe, fast]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -U pip pytest numpy numba pillow moderngl reportlab==5.0.1
      - name: Verify generated documentation
        run: |
          python -c 'from pathlib import Path; names=("PAL_GUIDE", "API_REFERENCE", "PAL_ARCHITECTURE_AND_DESIGN"); assert all((Path("Documentation") / (n + ".md")).is_file() and (Path("Documentation") / (n + ".pdf")).is_file() for n in names)'
          python Documentation/generators/generate_cheatsheet.py --check
      - name: Upload generated documentation
        if: matrix.mode == 'safe'
        uses: actions/upload-artifact@v4
        with:
          name: pal-documentation
          path: |
            Documentation/*.md
            Documentation/*.pdf
          if-no-files-found: error
          retention-days: 14
      - name: Install headless OpenGL backend
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1-mesa-dri
      - run: gcc -std=c11 -O3 -fPIC -shared -o libpal_native.so pal_native.c -lm
      - name: Diagnose AgentGrid compiled precision under sanitizers
        if: matrix.mode == 'safe'
        env:
          PAL_TEST_MODE: safe
          NUMBA_DISABLE_CACHE: '1'
          PYTHONMALLOC: debug
          PYTHONFAULTHANDLER: '1'
          ASAN_OPTIONS: detect_leaks=0:halt_on_error=1:abort_on_error=1
        shell: bash
        run: |
          set -euo pipefail
          gcc -std=c11 -O1 -g -fno-omit-frame-pointer -fsanitize=address,undefined -fPIC -shared -o libpal_native.so pal_native.c -lm
          LD_PRELOAD="$(gcc -print-file-name=libasan.so)" python -u -m pytest -vv -s --timeout=90 Testing/API/test_agentgrid_float64.py
          gcc -std=c11 -O3 -fPIC -shared -o libpal_native.so pal_native.c -lm
      - name: Run isolated test groups with per-test timeouts
        env:
          PAL_TEST_MODE: ${{ matrix.mode }}
          NUMBA_DISABLE_CACHE: '1'
        timeout-minutes: 20
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install pytest-timeout
          for group in Testing/API/test_*.py Testing/test_*.py; do
            echo "::group::Audit group $group"
            python -u -m pytest -vv -s --timeout=90 --timeout-method=signal "$group"
            echo "::endgroup::"
          done
      - name: API performance benchmark
        if: success()
        env:
          PAL_BENCH_MODE: ${{ matrix.mode }}
          NUMBA_DISABLE_CACHE: '1'
        run: |
          for i in 1 2 3 4 5; do
            PYTHONPATH=.. python Testing/benchmark_keyword_binding.py
          done

  windows-api:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [safe, fast]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -U pip pytest numpy numba pillow
      - name: Build native DLL with MSVC
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\\Microsoft Visual Studio\\Installer\\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSINSTALL=%%i"
          call "%VSINSTALL%\\VC\\Auxiliary\\Build\\vcvars64.bat"
          cl /O2 /LD pal_native.c /Fe:pal_native.dll
      - name: Run Windows API regressions
        env:
          PAL_TEST_MODE: ${{ matrix.mode }}
        run: python -m pytest -q Testing/API/test_constructors.py Testing/API/test_grid_api.py Testing/API/test_agentgrid_api.py Testing/API/test_popgrid_api.py
