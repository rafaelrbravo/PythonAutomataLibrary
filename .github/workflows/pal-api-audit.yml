name: PAL API Audit
on:
  push:
    branches:
      - main
      - pal-audit-ci-fix
  pull_request:
    branches:
      - main
jobs:
  api-audit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [safe, fast]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -U pip pytest numpy numba pillow moderngl reportlab==5.0.1
      - name: Verify generated API reference
        run: python Documentation/generate_api_reference.py --check
      - name: Verify generated documentation PDFs
        run: |
          python Documentation/generate_pdfs.py --check
          python Documentation/generate_cheatsheet.py --check
      - name: Install headless OpenGL backend
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1-mesa-dri
      - run: gcc -std=c11 -O3 -fPIC -shared -o libpal_native.so pal_native.c -lm
      - name: Run full Testing suite
        env:
          PAL_TEST_MODE: ${{ matrix.mode }}
          NUMBA_DISABLE_CACHE: '1'
        run: python -m pytest -q Testing
      - name: API performance benchmark
        if: success()
        env:
          PAL_BENCH_MODE: ${{ matrix.mode }}
          NUMBA_DISABLE_CACHE: '1'
        run: |
          for i in 1 2 3 4 5; do
            PYTHONPATH=.. python Testing/benchmark_keyword_binding.py
          done

  windows-examples:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [safe, fast]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -U pip pytest numpy numba pillow
      - name: Build native DLL with MSVC
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\\Microsoft Visual Studio\\Installer\\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSINSTALL=%%i"
          call "%VSINSTALL%\\VC\\Auxiliary\\Build\\vcvars64.bat"
          cl /O2 /LD pal_native.c /Fe:pal_native.dll
      - name: Run Windows real-example regressions
        env:
          PAL_TEST_MODE: ${{ matrix.mode }}
        run: python -m pytest -q Testing/API/test_persian_example_regression.py Testing/API/test_real_examples_smoke.py
