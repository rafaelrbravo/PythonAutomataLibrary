name: Build release distributions
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - '.github/workflows/release-build.yml'
      - 'pyproject.toml'
      - 'setup.py'
      - 'MANIFEST.in'
      - 'pal_native.c'
      - 'packaging/smoke_install.py'
permissions:
  contents: read
jobs:
  version-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate release tag before building
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os, pathlib, tomllib
          project = tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']
          assert os.environ['RELEASE_TAG'] == 'v' + project['version'], (os.environ['RELEASE_TAG'], project['version'])
          PY
  wheels:
    needs: version-check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15, macos-15-intel]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - name: Build platform wheels
        uses: pypa/cibuildwheel@v3.1
        env:
          CIBW_BUILD: 'cp310-* cp311-* cp312-* cp313-*'
          CIBW_SKIP: '*-musllinux_*'
          CIBW_ARCHS_LINUX: auto
          CIBW_ARCHS_WINDOWS: auto
          CIBW_ARCHS_MACOS: auto
          CIBW_TEST_COMMAND: python {project}/packaging/smoke_install.py
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl
          if-no-files-found: error
  sdist:
    needs: version-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install build
      - run: python -m build --sdist
      - uses: actions/upload-artifact@v4
        with:
          name: source-distribution
          path: dist/*.tar.gz
          if-no-files-found: error
  github-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: release-assets
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: source-distribution
          path: release-assets
      - name: Verify collected distributions
        working-directory: release-assets
        shell: python {0}
        run: |
          from pathlib import Path
          from zipfile import ZipFile
          wheels = list(Path('.').glob('*.whl'))
          sources = list(Path('.').glob('*.tar.gz'))
          assert wheels, 'No wheels collected'
          assert len(sources) == 1, 'Expected one source archive'
          for wheel in wheels:
              assert not wheel.name.endswith('-none-any.whl'), wheel
              with ZipFile(wheel) as archive:
                  assert any(name.endswith(('pal_native.dll', 'libpal_native.so', 'libpal_native.dylib')) for name in archive.namelist()), wheel
          print(f'Validated {len(wheels)} wheels and {len(sources)} source archive')
      - name: Generate SHA256 checksums
        working-directory: release-assets
        run: sha256sum *.whl *.tar.gz > SHA256SUMS.txt
      - name: Create draft GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: release-assets/*
          fail_on_unmatched_files: true
