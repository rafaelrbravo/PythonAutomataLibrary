name: Build release distributions
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - '.github/workflows/release-build.yml'
      - 'pyproject.toml'
      - 'setup.py'
      - 'MANIFEST.in'
      - 'pal_native.c'
      - '*.py'
      - '*.pyi'
      - 'packaging/**'
      - 'Tests/**'
      - 'Testing/**'
permissions:
  contents: read
jobs:
  version-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate release tag before building
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os, pathlib, tomllib
          project = tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']
          assert os.environ['RELEASE_TAG'] == 'v' + project['version'], (os.environ['RELEASE_TAG'], project['version'])
          PY
  wheels:
    needs: version-check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15, macos-15-intel]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - name: Build platform wheels
        uses: pypa/cibuildwheel@v3.1
        env:
          CIBW_BUILD: 'cp310-* cp311-* cp312-* cp313-*'
          CIBW_SKIP: '*-musllinux_*'
          CIBW_ARCHS_LINUX: auto
          CIBW_ARCHS_WINDOWS: AMD64
          CIBW_ARCHS_MACOS: auto
          CIBW_ENVIRONMENT: 'PIP_ONLY_BINARY=:all:'
          CIBW_TEST_COMMAND: python {project}/packaging/smoke_install.py
      - name: Validate wheel layout and native payload
        shell: python {0}
        run: |
          from pathlib import Path
          from zipfile import ZipFile
          wheels = list(Path("wheelhouse").glob("*.whl"))
          assert wheels, "No wheels built"
          for wheel in wheels:
              with ZipFile(wheel) as archive:
                  names = archive.namelist()
                  expected = ("pal_native.dll" if "win_amd64" in wheel.name else
                              "libpal_native.dylib" if "macosx" in wheel.name else
                              "libpal_native.so")
                  native = [name for name in names if name.endswith(("pal_native.dll", "libpal_native.so", "libpal_native.dylib"))]
                  assert len(native) == 1 and native[0].endswith(expected), f"Wrong native payload in {wheel}: {native}"
                  assert not any(".data/purelib/" in name for name in names), f"Binary wheel contains purelib payload: {wheel}"
                  wheel_metadata = next(name for name in names if name.endswith(".dist-info/WHEEL"))
                  metadata = archive.read(wheel_metadata).decode()
                  assert "Root-Is-Purelib: false" in metadata, f"Wheel marked pure: {wheel}"
          print(f"Validated {len(wheels)} native wheels")
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl
          if-no-files-found: error
  sdist:
    needs: version-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install build
      - run: python -m build --sdist
      - name: Validate source distribution
        shell: python {0}
        run: |
          from pathlib import Path
          import tarfile
          archives = list(Path("dist").glob("*.tar.gz"))
          assert len(archives) == 1, f"Expected one source archive, found {archives}"
          with tarfile.open(archives[0], "r:gz") as archive:
              names = archive.getnames()
              assert any(name.endswith("/pal_native.c") for name in names), "Missing native C source"
              assert any(name.endswith("/setup.py") for name in names), "Missing setup.py"
              forbidden = ("pal_native.dll", "libpal_native.so", "libpal_native.dylib")
              assert not any(name.endswith(forbidden) for name in names), "Precompiled native library included in sdist"
      - name: Verify source distribution builds a native wheel
        run: |
          python -m pip install --upgrade pip
          python -m pip wheel --no-deps --wheel-dir sdist-wheel dist/*.tar.gz
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          wheels = list(Path('sdist-wheel').glob('*.whl'))
          assert len(wheels) == 1, f'Expected one rebuilt wheel: {wheels}'
          with ZipFile(wheels[0]) as archive:
              names = archive.namelist()
              assert any(name.endswith('libpal_native.so') for name in names), 'sdist-built wheel missing Linux native library'
              assert not any(name.endswith(('pal_native.dll', 'libpal_native.dylib')) for name in names), 'sdist-built wheel contains foreign native library'
              metadata = next(name for name in names if name.endswith('.dist-info/WHEEL'))
              assert 'Root-Is-Purelib: false' in archive.read(metadata).decode(), 'sdist-built wheel is pure'
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: source-distribution
          path: dist/*.tar.gz
          if-no-files-found: error
  github-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: release-assets
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: source-distribution
          path: release-assets
      - name: Verify collected distributions
        working-directory: release-assets
        shell: python {0}
        run: |
          from pathlib import Path
          from zipfile import ZipFile
          import tarfile
          wheels = list(Path('.').glob('*.whl'))
          sources = list(Path('.').glob('*.tar.gz'))
          assert len(wheels) == 16, f'Expected 16 wheels (4 Python versions x 4 platforms), got {len(wheels)}'
          assert len(sources) == 1, 'Expected one source archive'
          with tarfile.open(sources[0], 'r:gz') as archive:
              source_names = archive.getnames()
              assert any(name.endswith('/pal_native.c') for name in source_names), 'Missing native C source'
              assert any(name.endswith('/setup.py') for name in source_names), 'Missing setup.py'
              assert not any(name.endswith(('pal_native.dll', 'libpal_native.so', 'libpal_native.dylib')) for name in source_names), 'Precompiled binary in source distribution'
          expected_platforms = ('manylinux', 'win_amd64', 'macosx')
          for python_tag in ('cp310', 'cp311', 'cp312', 'cp313'):
              matches = [wheel for wheel in wheels if f'-{python_tag}-{python_tag}-' in wheel.name]
              assert len(matches) == 4, f'Expected 4 wheels for {python_tag}, got {matches}'
              assert sum('macosx' in wheel.name for wheel in matches) == 2, matches
              assert sum('macosx' in wheel.name and wheel.name.endswith('_arm64.whl') for wheel in matches) == 1, matches
              assert sum('macosx' in wheel.name and wheel.name.endswith('_x86_64.whl') for wheel in matches) == 1, matches
              assert sum('manylinux' in wheel.name for wheel in matches) == 1, matches
              assert sum('win_amd64' in wheel.name for wheel in matches) == 1, matches
          for wheel in wheels:
              assert not wheel.name.endswith('-none-any.whl'), wheel
              with ZipFile(wheel) as archive:
                  names = archive.namelist()
                  expected = ('pal_native.dll' if 'win_amd64' in wheel.name else
                              'libpal_native.dylib' if 'macosx' in wheel.name else
                              'libpal_native.so')
                  native = [name for name in names if name.endswith(('pal_native.dll', 'libpal_native.so', 'libpal_native.dylib'))]
                  assert len(native) == 1 and native[0].endswith(expected), f'Unexpected native payload: {wheel}: {native}'
                  assert not any('.data/purelib/' in name for name in names), wheel
                  wheel_info = next(name for name in names if name.endswith('.dist-info/WHEEL'))
                  assert 'Root-Is-Purelib: false' in archive.read(wheel_info).decode(), wheel
          print(f'Validated {len(wheels)} wheels and {len(sources)} source archive')
      - name: Generate SHA256 checksums
        working-directory: release-assets
        run: sha256sum *.whl *.tar.gz > SHA256SUMS.txt
      - name: Create draft GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: release-assets/*
          fail_on_unmatched_files: true
