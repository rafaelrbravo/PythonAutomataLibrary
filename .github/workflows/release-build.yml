name: Build release distributions
# Validation rerun requested 2026-10-18; no release tag created.
# Build native libraries from source; no tracked build artifacts required.
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - '.github/workflows/release-build.yml'
      - 'pyproject.toml'
      - 'setup.py'
      - 'MANIFEST.in'
      - 'pal_native.c'
      - '*.py'
      - '*.pyi'
      - 'README.md'
      - 'LICENSE*'
      - 'packaging/**'
      - 'Tests/**'
      - 'Testing/**'
permissions:
  contents: read
concurrency:
  group: release-build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
jobs:
  version-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install release version validator
        if: startsWith(github.ref, 'refs/tags/v')
        run: python -m pip install packaging
      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python packaging/set_release_version.py
  wheels:
    needs: version-check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15, macos-15-intel]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set build version from release tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python packaging/set_release_version.py
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - name: Build platform wheels
        uses: pypa/cibuildwheel@v3.1
        env:
          CIBW_BUILD: 'cp312-*'
          CIBW_SKIP: '*-musllinux_*'
          CIBW_ARCHS_LINUX: auto
          CIBW_ARCHS_WINDOWS: AMD64
          CIBW_ARCHS_MACOS: auto
          CIBW_ENVIRONMENT: 'PIP_ONLY_BINARY=:all:'
          CIBW_TEST_COMMAND: python {project}/packaging/smoke_install.py
      - name: Validate wheel layout and native payload
        shell: python {0}
        run: |
          from pathlib import Path
          from zipfile import ZipFile
          import os
          import tomllib
          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          wheels = list(Path("wheelhouse").glob("*.whl"))
          assert len(wheels) == 1, f"Expected one Python-independent wheel per platform, found {len(wheels)}: {wheels}"
          assert '-py3-none-' in wheels[0].name, f'Incorrect Python wheel tag: {wheels[0]}'
          platform = {"Windows": "win_amd64", "Linux": "manylinux", "macOS": "macosx"}[os.environ["RUNNER_OS"]]
          for wheel in wheels:
              assert platform in wheel.name, f"Wheel platform does not match runner {platform}: {wheel}"
              assert wheel.name.startswith(f"pythonautomatalibrary-{version}-"), f"Wheel version mismatch: {wheel}"
              with ZipFile(wheel) as archive:
                  names = archive.namelist()
                  expected = ("pal_native.dll" if "win_amd64" in wheel.name else
                              "libpal_native.dylib" if "macosx" in wheel.name else
                              "libpal_native.so")
                  native = [name for name in names if name.endswith(("pal_native.dll", "libpal_native.so", "libpal_native.dylib"))]
                  assert len(native) == 1 and native[0].endswith(expected), f"Wrong native payload in {wheel}: {native}"
                  assert not any(".data/purelib/" in name for name in names), f"Binary wheel contains purelib payload: {wheel}"
                  wheel_metadata = next(name for name in names if name.endswith(".dist-info/WHEEL"))
                  metadata = archive.read(wheel_metadata).decode()
                  assert "Root-Is-Purelib: false" in metadata, f"Wheel marked pure: {wheel}"
          print(f"Validated {len(wheels)} native wheels")
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl
          if-no-files-found: error
  wheel-compatibility:
    needs: wheels
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15, macos-15-intel]
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install wheel without source builds and smoke test
        shell: bash
        run: |
          python -m pip install --only-binary=:all: wheelhouse/*.whl
          python -m pip check
          python packaging/smoke_install.py
  sdist:
    needs: version-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install build packaging
      - name: Set build version from release tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python packaging/set_release_version.py

      - run: python -m build --sdist
      - name: Validate source distribution
        shell: python {0}
        run: |
          from pathlib import Path
          import tarfile
          archives = list(Path("dist").glob("*.tar.gz"))
          assert len(archives) == 1, f"Expected one source archive, found {archives}"
          import tomllib
          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          assert archives[0].name == f"pythonautomatalibrary-{version}.tar.gz", f"Source archive version mismatch: {archives[0]}"
          with tarfile.open(archives[0], "r:gz") as archive:
              names = archive.getnames()
              assert any(name.endswith("/pal_native.c") for name in names), "Missing native C source"
              assert any(name.endswith("/setup.py") for name in names), "Missing setup.py"
              assert any(name.endswith("/pyproject.toml") for name in names), "Missing pyproject.toml"
              assert any(name.endswith("/README.md") for name in names), "Missing README.md"
              assert any(name.endswith("/build_native.py") for name in names), "Missing native build helper"
              forbidden_suffixes = (".dll", ".so", ".dylib", ".pyd")
              assert not any(name.lower().endswith(forbidden_suffixes) for name in names), "Precompiled native library included in sdist"
      - name: Verify source distribution builds a native wheel
        run: |
          python -m pip install --upgrade pip
          python -m pip wheel --no-deps --wheel-dir sdist-wheel dist/*.tar.gz
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          wheels = list(Path('sdist-wheel').glob('*.whl'))
          assert len(wheels) == 1, f'Expected one rebuilt wheel: {wheels}'
          import tomllib
          version = tomllib.loads(Path('pyproject.toml').read_text())['project']['version']
          assert wheels[0].name.startswith(f'pythonautomatalibrary-{version}-'), f'sdist-rebuilt wheel version mismatch: {wheels[0]}'
          with ZipFile(wheels[0]) as archive:
              names = archive.namelist()
              native = [name for name in names if name.endswith(('pal_native.dll', 'libpal_native.so', 'libpal_native.dylib'))]
              assert len(native) == 1 and native[0].endswith('libpal_native.so'), f'sdist-built wheel has invalid native payload: {native}'
              assert not any('.data/purelib/' in name for name in names), 'sdist-built wheel contains purelib payload'
              metadata = next(name for name in names if name.endswith('.dist-info/WHEEL'))
              assert 'Root-Is-Purelib: false' in archive.read(metadata).decode(), 'sdist-built wheel is pure'
          PY
      - name: Smoke-test wheel rebuilt from source archive
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/pal-sdist-install"
          "$RUNNER_TEMP/pal-sdist-install/bin/python" -m pip install sdist-wheel/*.whl
          "$RUNNER_TEMP/pal-sdist-install/bin/python" -m pip check
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/pal-sdist-install/bin/python" "$GITHUB_WORKSPACE/packaging/smoke_install.py"
      - uses: actions/upload-artifact@v4
        with:
          name: source-distribution
          path: dist/*.tar.gz
          if-no-files-found: error
  verify-release-assets:
    needs: [wheels, wheel-compatibility, sdist]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: release-assets
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: source-distribution
          path: release-assets
      - name: Verify collected distributions
        working-directory: release-assets
        shell: python {0}
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          from pathlib import Path
          from zipfile import ZipFile
          import tarfile
          wheels = list(Path('.').glob('*.whl'))
          sources = list(Path('.').glob('*.tar.gz'))
          assert len(wheels) == 4, f'Expected 4 platform wheels, got {len(wheels)}'
          assert len(sources) == 1, 'Expected one source archive'
          import os
          import tomllib
          tag = os.environ.get('RELEASE_TAG', '')
          version = tag[1:] if tag.startswith('v') else tomllib.loads(Path('../pyproject.toml').read_text())['project']['version']
          assert all(wheel.name.startswith(f'pythonautomatalibrary-{version}-') for wheel in wheels), 'Release wheel version mismatch'
          assert sources[0].name == f'pythonautomatalibrary-{version}.tar.gz', 'Release source version mismatch'
          with tarfile.open(sources[0], 'r:gz') as archive:
              source_names = archive.getnames()
              assert any(name.endswith('/pal_native.c') for name in source_names), 'Missing native C source'
              assert any(name.endswith('/setup.py') for name in source_names), 'Missing setup.py'
              assert any(name.endswith('/pyproject.toml') for name in source_names), 'Missing pyproject.toml'
              assert any(name.endswith('/README.md') for name in source_names), 'Missing README.md'
              assert any(name.endswith('/build_native.py') for name in source_names), 'Missing native build helper'
              assert not any(name.lower().endswith(('.dll', '.so', '.dylib', '.pyd')) for name in source_names), 'Precompiled binary in source distribution'
          assert all('-py3-none-' in wheel.name for wheel in wheels), wheels
          assert sum('macosx' in wheel.name for wheel in wheels) == 2, wheels
          assert sum('manylinux' in wheel.name for wheel in wheels) == 1, wheels
          assert sum('win_amd64' in wheel.name for wheel in wheels) == 1, wheels
          for wheel in wheels:
              assert not wheel.name.endswith('-none-any.whl'), wheel
              with ZipFile(wheel) as archive:
                  names = archive.namelist()
                  expected = ('pal_native.dll' if 'win_amd64' in wheel.name else
                              'libpal_native.dylib' if 'macosx' in wheel.name else
                              'libpal_native.so')
                  native = [name for name in names if name.endswith(('pal_native.dll', 'libpal_native.so', 'libpal_native.dylib'))]
                  assert len(native) == 1 and native[0].endswith(expected), f'Unexpected native payload: {wheel}: {native}'
                  assert not any('.data/purelib/' in name for name in names), wheel
                  wheel_info = next(name for name in names if name.endswith('.dist-info/WHEEL'))
                  assert 'Root-Is-Purelib: false' in archive.read(wheel_info).decode(), wheel
          print(f'Validated {len(wheels)} wheels and {len(sources)} source archive')
      - name: Generate SHA256 checksums
        working-directory: release-assets
        run: sha256sum *.whl *.tar.gz > SHA256SUMS.txt
      - name: Upload verified release assets for review
        if: "!startsWith(github.ref, 'refs/tags/v')"
        uses: actions/upload-artifact@v4
        with:
          name: verified-release-assets
          path: release-assets/*
          if-no-files-found: error
      - name: Upload verified release assets for tagged build
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: verified-tagged-release-assets
          path: release-assets/*
          if-no-files-found: error
  github-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify-release-assets
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: verified-tagged-release-assets
          path: release-assets
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          files: release-assets/*
          fail_on_unmatched_files: true
  publish-pypi:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: github-release
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/PythonAutomataLibrary/
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: verified-tagged-release-assets
          path: dist
      - name: Verify release checksums
        working-directory: dist
        run: sha256sum --check SHA256SUMS.txt
      - name: Remove checksum manifest from upload directory
        run: rm dist/SHA256SUMS.txt
      - name: Publish verified artifacts to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
