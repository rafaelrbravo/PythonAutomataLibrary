name: Conda package smoke tests
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'packaging/conda/meta.yaml'
      - 'pyproject.toml'
      - 'setup.py'
      - 'pal_native.c'
      - '.github/workflows/conda-smoke.yml'
  pull_request:
    branches: [main]
jobs:
  conda-build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v3
        with:
          auto-update-conda: true
          activate-environment: pal-build
          python-version: '3.12'
      - name: Install conda-build
        run: conda install -y -c conda-forge conda-build
      - name: Build and test PAL conda package
        run: conda build packaging/conda --override-channels -c conda-forge
