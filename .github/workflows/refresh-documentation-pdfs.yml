name: Refresh documentation
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - documentation-paired-formats
    paths:
      - 'Documentation/generators/*.py'
      - '.github/workflows/refresh-documentation-pdfs.yml'
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install reportlab==5.0.1
      - name: Generate documentation
        run: |
          python Documentation/generators/generate_manual.py
          python Documentation/generators/generate_api_guide.py
          python Documentation/generators/generate_api_reference.py
          python Documentation/generators/generate_cheatsheet.py
      - name: Commit generated documentation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Documentation/*.md Documentation/*.pdf
          git diff --cached --quiet && exit 0
          git commit -m "Refresh PAL documentation"
          git push
