name: Refresh documentation
# PAL API Audit is triggered after this workflow completes successfully.
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - fix/diffusion-mask-boundary-conditions
    paths:
      - 'Documentation/*.md'
      - 'Documentation/generators/*.py'
      - '.github/workflows/refresh-documentation-pdfs.yml'
concurrency:
  group: pal-docs-refresh-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install reportlab==5.0.1 requests playwright
      - run: python -m playwright install --with-deps chromium
      - name: Generate documentation
        run: |
          python Documentation/generators/markdown_to_pdf.py Documentation/PAL_ARCHITECTURE_AND_DESIGN.md
          python Documentation/generators/markdown_to_pdf.py Documentation/API_GUIDE.md
          python Documentation/generators/markdown_to_pdf.py Documentation/API_REFERENCE.md
          python Documentation/generators/generate_cheatsheet.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit generated documentation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Documentation/*.md Documentation/*.pdf
          git diff --cached --quiet && exit 0
          git commit -m "Refresh PAL documentation"
          # Another documentation run may have updated PDFs since checkout.
          # Re-render from the latest Markdown instead of rebasing binary PDFs.
          for attempt in 1 2 3; do
            if git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"; then
              exit 0
            fi
            git fetch origin "${GITHUB_REF_NAME}"
            git reset --hard FETCH_HEAD
            export GITHUB_TOKEN="${{ secrets.GITHUB_TOKEN }}"
            python Documentation/generators/markdown_to_pdf.py Documentation/PAL_ARCHITECTURE_AND_DESIGN.md
            python Documentation/generators/markdown_to_pdf.py Documentation/API_GUIDE.md
            python Documentation/generators/markdown_to_pdf.py Documentation/API_REFERENCE.md
            python Documentation/generators/generate_cheatsheet.py
            git add Documentation/*.md Documentation/*.pdf
            if git diff --cached --quiet; then
              exit 0
            fi
            git commit -m "Refresh PAL documentation"
          done
          echo "Could not push generated PDFs after retries" >&2
          exit 1
