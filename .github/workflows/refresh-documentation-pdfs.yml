name: Refresh documentation
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'Documentation/generators/*.py'
      - '.github/workflows/refresh-documentation-pdfs.yml'
concurrency:
  group: pal-docs-refresh-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install reportlab==5.0.1
      - name: Generate documentation
        run: |
          python Documentation/generators/generate_manual.py
          python Documentation/generators/generate_api_guide.py
          python Documentation/generators/generate_api_reference.py
          python Documentation/generators/generate_cheatsheet.py
      - name: Render cheatsheet preview for visual QA
        run: |
          python -m pip install pymupdf
          python - <<'PY'
          import fitz
          doc = fitz.open('Documentation/CHEATSHEET.pdf')
          assert len(doc) == 1, f'Expected one page, got {len(doc)}'
          doc[0].get_pixmap(matrix=fitz.Matrix(1.5, 1.5), alpha=False).save('Documentation/CHEATSHEET-preview.png')
          PY
      - name: Commit generated documentation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Documentation/*.md Documentation/*.pdf Documentation/CHEATSHEET-preview.png
          git diff --cached --quiet && exit 0
          git commit -m "Refresh PAL documentation"
          git pull --rebase origin main
          git push
