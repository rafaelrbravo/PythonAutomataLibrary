name: Refresh documentation PDFs
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install reportlab==5.0.1
      - run: python Documentation/generate_api_reference.py
      - run: python Documentation/generate_pdfs.py
      - name: Commit generated documentation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Documentation/source/API_REFERENCE.md Documentation/*.pdf
          git diff --cached --quiet && exit 0
          git commit -m "Refresh PAL documentation PDFs"
          git push
