name: Publish PAL to PyPI
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Published GitHub release tag to publish (for example v0.1.0)
        required: true
        type: string
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/PythonAutomataLibrary/
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify release version
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          python - <<'PY'
          import os, pathlib, tomllib
          version = tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version']
          assert os.environ['RELEASE_TAG'] == 'v' + version, 'Tag/version mismatch'
          PY
      - name: Confirm GitHub release is published
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease --jq 'if .isDraft or .isPrerelease then error("Release must be published and non-prerelease") else "Release verified" end'
      - name: Download published GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          mkdir -p dist
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir dist --pattern '*.whl'
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir dist --pattern '*.tar.gz'
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir dist --pattern 'SHA256SUMS.txt'
      - name: Verify checksums and distributions
        working-directory: dist
        run: |
          test -f SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt
          test -n "$(find . -maxdepth 1 -name '*.whl' -print -quit)"
          test -n "$(find . -maxdepth 1 -name '*.tar.gz' -print -quit)"
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          wheels = list(Path('.').glob('*.whl'))
          sources = list(Path('.').glob('*.tar.gz'))
          assert wheels and len(sources) == 1
          checksums = Path('SHA256SUMS.txt').read_text().splitlines()
          listed = [line.split('  ', 1)[1] for line in checksums]
          actual = sorted(path.name for path in [*wheels, *sources])
          assert sorted(listed) == actual, f'Checksum manifest does not exactly match distributions: {listed!r} vs {actual!r}'
          assert len({wheel.name for wheel in wheels}) == len(wheels)
          for wheel in wheels:
              assert not wheel.name.endswith('-none-any.whl'), wheel
              with ZipFile(wheel) as z:
                  names = z.namelist()
                  expected = ('pal_native.dll' if 'win_amd64' in wheel.name else
                              'libpal_native.dylib' if 'macosx' in wheel.name else
                              'libpal_native.so')
                  native = [n for n in names if n.endswith(('pal_native.dll', 'libpal_native.so', 'libpal_native.dylib'))]
                  assert len(native) == 1 and native[0].endswith(expected), f'Unexpected native payload: {wheel}: {native}'
                  assert not any('.data/purelib/' in n for n in names), wheel
                  wheel_info = next(n for n in names if n.endswith('.dist-info/WHEEL'))
                  assert 'Root-Is-Purelib: false' in z.read(wheel_info).decode(), wheel
          PY
          rm SHA256SUMS.txt
      - name: Publish verified artifacts using PyPI trusted publishing
        uses: pypa/gh-action-pypi-publish@release/v1
