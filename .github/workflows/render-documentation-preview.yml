name: Render documentation preview
on:
  push:
    paths:
      - '.github/workflows/render-documentation-preview.yml'
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render contact sheets
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils imagemagick
          mkdir -p /tmp/render
          for f in Documentation/*.pdf; do
            base=$(basename "$f" .pdf)
            pdftoppm -png -r 90 "$f" "/tmp/render/$base" >/dev/null 2>&1
            montage /tmp/render/$base-*.png -thumbnail 300x -tile 3x -geometry +8+8 "/tmp/$base.png"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: documentation-previews
          path: /tmp/*.png
