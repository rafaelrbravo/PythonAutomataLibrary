name: Bootstrap documentation PDFs
on:
  push:
    branches: [main]
    paths:
      - 'Documentation/generate_pdfs.py'
      - 'Documentation/MANUAL.md'
      - 'Documentation/API_GUIDE.md'
      - 'Documentation/API_REFERENCE.md'
      - 'Documentation/CHEATSHEET.md'
      - '.github/workflows/bootstrap-documentation-pdfs.yml'
permissions:
  contents: write
jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install reportlab
      - run: python Documentation/generate_pdfs.py
      - name: Commit generated PDFs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Documentation/*.pdf
          git diff --cached --quiet && exit 0
          git commit -m "Generate PAL documentation PDFs"
          git push
