name: Package smoke tests
# Validation rerun requested 2026-10-18; no release tag created.
# Validate clean source checkouts without committed native binaries.
on:
  push:
    branches: [main]
    paths:
      - 'setup.py'
      - 'pyproject.toml'
      - 'MANIFEST.in'
      - 'pal_native.c'
      - 'packaging/smoke_install.py'
      - '.github/workflows/package-smoke.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: package-smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/main' }}
jobs:
  wheel-install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with:
          arch: amd64
      - name: Build wheel and source distribution
        run: |
          python -m pip install -U build wheel
          python -m build
      - name: Check wheel tags and native library
        shell: python {0}
        run: |
          import glob, os, zipfile, tarfile
          wheel, = glob.glob('dist/*.whl')
          expected = {'Windows': 'pal_native.dll', 'Linux': 'libpal_native.so', 'macOS': 'libpal_native.dylib'}[os.environ['RUNNER_OS']]
          with zipfile.ZipFile(wheel) as z:
              names = z.namelist()
              native = [n for n in names if n.endswith(('pal_native.dll', 'libpal_native.so', 'libpal_native.dylib'))]
              assert len(native) == 1 and native[0].endswith('/' + expected), f'Wrong native payload: {native}'
              assert '-none-any.whl' not in wheel, wheel
              wheel_info, = [n for n in names if n.endswith('.dist-info/WHEEL')]
              assert 'Root-Is-Purelib: false' in z.read(wheel_info).decode(), 'Wheel marked pure'
          with tarfile.open(glob.glob('dist/*.tar.gz')[0], 'r:gz') as t:
              names = t.getnames()
              assert any(n.endswith('/pal_native.c') for n in names), 'C source missing from sdist'
              assert any(n.endswith('/setup.py') for n in names), 'setup.py missing from sdist'
              assert any(n.endswith('/pyproject.toml') for n in names), 'pyproject.toml missing from sdist'
              assert any(n.endswith('/build_native.py') for n in names), 'Native build helper missing from sdist'
              assert not any(n.lower().endswith(('.dll', '.so', '.dylib', '.pyd')) for n in names), 'Compiled library included in sdist'
          print(wheel)
      - name: Install wheel outside repository
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/pal-install-check"
          if [ -f "$RUNNER_TEMP/pal-install-check/bin/python" ]; then PY="$RUNNER_TEMP/pal-install-check/bin/python"; else PY="$RUNNER_TEMP/pal-install-check/Scripts/python.exe"; fi
          "$PY" -m pip install dist/*.whl
          "$PY" -m pip check
          PY="$(cd "$(dirname "$PY")" && pwd)/$(basename "$PY")"
          cd "$RUNNER_TEMP"
          "$PY" -c "import PythonAutomataLibrary as pal; assert 'pal-install-check' in pal.__file__"
          "$PY" "$GITHUB_WORKSPACE/packaging/smoke_install.py"
      - name: Build wheel from source archive
        shell: bash
        run: |
          SDIST="$(pwd)/$(echo dist/*.tar.gz)"
          cd "$RUNNER_TEMP"
          mkdir -p pal-sdist-check
          tar -xzf "$SDIST" -C pal-sdist-check --strip-components=1
          cd pal-sdist-check
          python -m build --wheel
          python -m venv "$RUNNER_TEMP/pal-sdist-install"
          if [ -f "$RUNNER_TEMP/pal-sdist-install/bin/python" ]; then SPY="$RUNNER_TEMP/pal-sdist-install/bin/python"; else SPY="$RUNNER_TEMP/pal-sdist-install/Scripts/python.exe"; fi
          "$SPY" -m pip install dist/*.whl
          "$SPY" -m pip check
          cd "$RUNNER_TEMP"
          "$SPY" "$GITHUB_WORKSPACE/packaging/smoke_install.py"
      - uses: actions/upload-artifact@v4
        with:
          name: pal-package-${{ matrix.os }}
          path: dist/*
