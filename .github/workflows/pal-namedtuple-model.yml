name: PAL NamedTuple Model Test
on:
  push:
    branches: [main]
    paths:
      - 'Testing/API/test_namedtuple_model.py'
      - '.github/workflows/pal-namedtuple-model.yml'
  workflow_dispatch:
concurrency:
  group: pal-namedtuple-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}
jobs:
  namedtuple-model:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [safe, fast]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -U pip pytest numpy numba pillow moderngl
      - run: gcc -std=c11 -O3 -fPIC -shared -o libpal_native.so pal_native.c -lm
      - name: Run NamedTuple model test
        env:
          PAL_TEST_MODE: ${{ matrix.mode }}
          NUMBA_DISABLE_CACHE: '1'
        run: python -m pytest -q Testing/API/test_namedtuple_model.py
