[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "PythonAutomataLibrary"
version = "0.1.0"
dependencies = [
    "numpy",
    "numba",
]

[tool.setuptools]
packages = ["PythonAutomataLibrary"]
include-package-data = true

[tool.setuptools.package-data]
PythonAutomataLibrary = ["*.dll", "*.so", "*.dylib"]

[tool.setuptools.package-dir]
PythonAutomataLibrary = "."