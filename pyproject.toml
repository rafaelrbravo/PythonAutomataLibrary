[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "PythonAutomataLibrary"
version = "1.0.3"
license = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "numba",
    "pygame>=2.5",
    "moderngl>=5.10",
    "pyglet>=2.0",
    "pillow>=10",
]

[tool.setuptools]
packages = ["PythonAutomataLibrary"]
include-package-data = true

[tool.setuptools.package-data]
PythonAutomataLibrary = ["*.dll", "*.so", "*.dylib", "Examples/**/*", "Documentation/*.pdf"]

[tool.setuptools.package-dir]
PythonAutomataLibrary = "."
